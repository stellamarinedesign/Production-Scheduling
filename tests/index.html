<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Transform tests — Stella Production Board</title>
<!-- The print measurement tests are only meaningful with the real print CSS loaded.
     Listed first so the test page's own rules below still win for its chrome. -->
<link rel="stylesheet" href="../css/style.css">
<style>
  :root { --bg:#0E0A0A; --panel:#282827; --line:#454542; --dim:#b0b0ab;
          --red:#EA372E; --green:#5fb85f; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:#fff; font:14px/1.5 ui-monospace,Consolas,monospace; padding:24px; }
  h1 { font-size:17px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:4px; }
  .sub { color:var(--dim); font-size:12.5px; margin-bottom:18px; }
  #summary { border:2px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:16px;
             background:var(--panel); font-size:15px; }
  #summary.pass { border-color:var(--green); }
  #summary.fail { border-color:var(--red); }
  .row { display:flex; gap:10px; padding:6px 10px; border-bottom:1px solid var(--line); align-items:flex-start; }
  .row .mark { flex-shrink:0; width:18px; font-weight:700; }
  .ok .mark { color:var(--green); }
  .no .mark { color:var(--red); }
  .no .name { color:var(--red); }
  .name { flex:1; }
  .detail { color:var(--dim); font-size:12.5px; white-space:pre-wrap; padding:4px 0 8px 38px;
            border-bottom:1px solid var(--line); }
</style>
</head>
<body>
<h1>Transform tests</h1>
<div class="sub">Runs the xlsx adapter and the transform against the real 21/08/2026 export,
and compares against the reference implementation's output.</div>
<div id="summary">running…</div>
<div id="list"></div>

<script type="module">
import { run } from './run.js';

const summary = document.getElementById('summary');
const list = document.getElementById('list');

try {
  const results = await run();
  const failed = results.filter(r => !r.pass);

  summary.className = failed.length ? 'fail' : 'pass';
  summary.textContent = failed.length
    ? `${failed.length} of ${results.length} FAILED`
    : `all ${results.length} passed`;

  for (const r of results) {
    const row = document.createElement('div');
    row.className = `row ${r.pass ? 'ok' : 'no'}`;
    row.innerHTML = `<span class="mark">${r.pass ? '✓' : '✗'}</span><span class="name"></span>`;
    row.querySelector('.name').textContent = r.name;
    list.append(row);
    if (!r.pass && r.detail) {
      const d = document.createElement('div');
      d.className = 'detail';
      d.textContent = r.detail;
      list.append(d);
    }
  }

  // Machine-readable line for the headless run.
  console.log(`TESTS ${failed.length ? 'FAIL' : 'PASS'} ${results.length - failed.length}/${results.length}`);
  for (const f of failed) console.log(`FAILED: ${f.name}${f.detail ? ` — ${f.detail}` : ''}`);
} catch (e) {
  summary.className = 'fail';
  summary.textContent = `threw: ${e.message}`;
  console.log(`TESTS ERROR ${e.message}`);
  console.error(e);
}
</script>
</body>
</html>
